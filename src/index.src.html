<meta charset="utf-8">
<title>521 Coffee Cart POS</title>
<style id="css">
/* Font asli 521: Paralucent (disematkan, tidak perlu internet) */
__FONTS__
/* Layout: login terbelah (foto brand | keypad) → kasir: grid menu + struk berjalan di kanan, dock mengambang di bawah.
   Tampilan gelap yang disengaja: hitam hangat, amber → ember seperti logo 521, tekstur mosaik kaca tipis. */
:root{
  /* Warna dasar brand 521: lime #D8FF00 + merah bata #C03200 → #862401 */
  --lime:#D8FF00;--red:#C03200;--red2:#862401;
  --bg:#120504;--sf:#1d0a06;--sf2:#270f09;--sf3:#37170d;--ink:#fff4ec;--mute:#c49a87;--dim:#8a5d4b;--line:#3a1a10;
  --ac:#D8FF00;--ac2:#B8E600;--on:#1a0700;--warn:#ff8a5c;--ok:#9be0a9;
  --f-d:"Paralucent521",system-ui,sans-serif;--f-b:"Paralucent521",system-ui,-apple-system,"Segoe UI",sans-serif;--f-m:"Paralucent521",system-ui,sans-serif;
  --r:20px;--glass:color-mix(in srgb,var(--sf) 78%,transparent);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:16px/1.45 var(--f-b);-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(60% 50% at 92% -8%,color-mix(in srgb,var(--red) 45%,transparent),transparent 70%),radial-gradient(40% 40% at -5% 105%,color-mix(in srgb,var(--ac2) 14%,transparent),transparent 70%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:linear-gradient(color-mix(in srgb,var(--ac) 10%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--ac) 10%,transparent) 1px,transparent 1px);background-size:22px 22px;
  -webkit-mask-image:radial-gradient(45% 40% at 100% 0,#000,transparent);mask-image:radial-gradient(45% 40% at 100% 0,#000,transparent)}
#login,#app{position:relative;z-index:1}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
h2{font:800 26px/1.1 var(--f-d);font-stretch:115%;letter-spacing:-.02em;margin:26px 0 14px;text-wrap:balance}
h3{font:700 11px var(--f-b);text-transform:uppercase;letter-spacing:.14em;color:var(--mute);margin:24px 0 10px}
.mute{color:var(--mute)}small{display:block;font-size:13px}
.num{font-family:var(--f-m);font-variant-numeric:tabular-nums;letter-spacing:0}
body [class],body b,body span,body output{font-variant-numeric:tabular-nums}
input,select,textarea{width:100%;font:inherit;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);margin:4px 0 10px;transition:border-color .15s}
input:focus,select:focus{border-color:var(--ac);outline:none}
label,.lbl{display:block;font-size:13px;color:var(--mute);margin-top:8px}
.btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:16px;padding:16px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--on);font-weight:800;font-size:16px;margin-top:10px;box-shadow:0 8px 24px -10px var(--ac2);transition:transform .1s,filter .15s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--sf2);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-weight:700}
.btn.sm{width:auto;padding:11px 16px;margin:4px 0 10px;font-size:14px}
.btn:disabled{background:var(--sf3);color:var(--dim);box-shadow:none;cursor:default;transform:none}
a.btn{text-decoration:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chips button{border:1px solid var(--line);background:var(--sf2);border-radius:999px;padding:9px 15px;font-size:14px;font-weight:600;color:var(--mute)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.scroll::-webkit-scrollbar{display:none}
.scroll button{flex:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.add{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.av{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--on);font:800 15px var(--f-d);flex:none}
.pill{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--sf3);color:var(--mute);margin-left:6px;vertical-align:2px}
.pill.own{background:color-mix(in srgb,var(--ac) 20%,var(--sf2));color:var(--ac)}
.pill.x{position:static;width:auto;height:auto;display:inline-block;place-items:normal;border-radius:999px;top:auto;right:auto;color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,var(--sf2))}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Login ---------- */
.login{min-height:100vh;min-height:100dvh;display:grid;grid-template-rows:auto 1fr}
.brandart{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--lime)}
.brandart svg{width:44%;max-width:300px;height:auto;aspect-ratio:1565/1015}
.brandart span{font:700 clamp(15px,3.2vw,26px) var(--f-d);letter-spacing:.01em}
.hero{background:linear-gradient(180deg,var(--red2),var(--red));aspect-ratio:4/5;width:100%;max-width:560px;margin:0 auto;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(to bottom,transparent,var(--bg))}
.lp{width:100%;max-width:420px;margin:-40px auto 0;padding:0 16px 32px;position:relative;z-index:4}
.eyebrow{font:700 11px var(--f-b);letter-spacing:.18em;text-transform:uppercase;color:var(--ac)}
.lp h1{font:900 38px/1 var(--f-d);font-stretch:120%;letter-spacing:-.03em;margin:8px 0 6px}
.lp .sub{color:var(--mute);margin:0 0 20px}
.users{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.users button{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--sf);border-radius:16px;padding:10px;text-align:left;transition:border-color .15s,background .15s}
.users button[aria-pressed="true"]{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 10%,var(--sf))}
.users b{display:block;font-size:15px}.users small{color:var(--mute);font-size:12px}
.pw{position:relative;margin:22px 0 0}
.pw input{margin:0;padding:15px 52px 15px 16px;font:600 20px var(--f-m);letter-spacing:.12em;text-align:center;background:var(--sf);border-radius:16px}
.pw input::placeholder{font:500 15px var(--f-b);letter-spacing:0;color:var(--dim)}
.pw input.err{border-color:var(--warn);animation:shake .32s}
.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:11px;background:var(--sf2);color:var(--mute);display:grid;place-items:center}
.dots{display:flex;justify-content:center;gap:14px;margin:26px 0 4px;height:16px}
.dots i{width:13px;height:13px;border-radius:50%;border:2px solid var(--sf3);transition:all .15s}
.dots i.on{background:var(--ac);border-color:var(--ac);box-shadow:0 0 12px var(--ac)}
.dots.err i{border-color:var(--warn);animation:shake .32s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.lerr{text-align:center;color:var(--warn);font-size:14px;min-height:21px;margin:6px 0}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:64px;border:1px solid var(--line);background:var(--sf);border-radius:18px;font:600 24px var(--f-m);transition:background .1s,transform .1s}
.pad button:active{background:var(--sf3);transform:scale(.96)}
.pad .go{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--on);border:0;font:800 16px var(--f-b)}
.pad .del{font:600 14px var(--f-b);color:var(--mute)}
.hint{margin:18px 0 0;padding:12px 14px;border:1px dashed var(--sf3);border-radius:14px;font-size:13px;color:var(--mute)}
.hint b{color:var(--ink)}
@media (min-width:900px){
  .login{grid-template-rows:none;grid-template-columns:minmax(0,1.15fr) minmax(400px,.85fr);align-items:center}
  .hero{aspect-ratio:4/5;height:calc(100vh - 64px);height:calc(100dvh - 64px);width:auto;max-width:calc(100% - 48px);margin:32px auto;border-radius:28px;border:1px solid var(--line);box-shadow:0 30px 80px -30px rgba(0,0,0,.8)}
  .hero::after{display:none}
  .lp{margin:0 auto;padding:32px}
}

/* ---------- Shell ---------- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:14px;padding:12px 16px;background:var(--glass);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border-bottom:1px solid var(--line)}
.mark{width:40px;height:26px;color:var(--ac);flex:none}
.brand{min-width:0;flex:1}
.brand b{display:block;font:800 16px/1.15 var(--f-d);font-stretch:112%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.today{display:none;text-align:right;line-height:1.15}
.today span{display:block;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.1em}
.today b{font:600 16px var(--f-m)}
@media (min-width:700px){.today{display:block;padding-right:14px;border-right:1px solid var(--line)}}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--sf);border-radius:14px;padding:5px 10px 5px 5px;font-size:14px;font-weight:600}
.who .av{width:30px;height:30px;border-radius:9px;font-size:13px}
.who svg{color:var(--mute);width:18px;height:18px}
.who .nm{max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:1240px;margin:0 auto;padding:4px 16px 190px}
.greet{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:22px 0 14px}
.greet h2{margin:0}
.greet p{margin:4px 0 0;color:var(--mute)}
.greet .clk{font:600 14px var(--f-m);color:var(--mute)}
nav.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:4px;padding:6px;background:var(--glass);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 40px -12px rgba(0,0,0,.7);width:min(520px,calc(100% - 24px))}
nav.dock button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:8px 2px;border-radius:16px;color:var(--dim);font-size:11px;font-weight:700;letter-spacing:.02em;transition:color .15s,background .15s}
nav.dock button[aria-pressed="true"]{color:var(--on);background:linear-gradient(135deg,var(--ac),var(--ac2))}
nav.dock button{min-width:0}nav.dock:has(button:nth-child(7)) button{font-size:10px;letter-spacing:0;padding:8px 0}
.subcard .btn{width:100%}.subcard .von{border-color:color-mix(in srgb,var(--ac) 45%,var(--line));background:color-mix(in srgb,var(--ac) 10%,var(--sf2))}.subcard .von b{color:var(--ac)}

/* ---------- Kasir ---------- */
.split{display:block}
.cartp{display:none}
@media (min-width:960px){
  .split{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:26px;align-items:start}
  .cartp{display:block;position:sticky;top:86px;max-height:calc(100vh - 186px);overflow:auto;border-radius:24px;scrollbar-width:thin}
}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.tw{position:relative}
.tile{position:relative;width:100%;text-align:left;border:1px solid var(--line);background:radial-gradient(120% 90% at 100% 100%,color-mix(in srgb,var(--pc,#6b4a2f) 40%,transparent),transparent 60%),var(--sf);border-radius:var(--r);padding:14px;min-height:136px;display:flex;flex-direction:column;gap:2px;overflow:hidden;transition:transform .1s,border-color .15s,box-shadow .15s}
.tile:hover{border-color:var(--sf3)}
.tile:active{transform:scale(.97)}
.tile .cat{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.tile b{font:800 18px/1.1 var(--f-d);font-stretch:110%;letter-spacing:-.01em;position:relative;z-index:1;padding-right:24px}
.tile .pr{margin-top:auto;font:600 15px var(--f-m);position:relative;z-index:1}
.tile .gl{position:absolute;right:-6px;bottom:-14px;font:900 70px/1 var(--f-d);font-stretch:125%;letter-spacing:-.06em;color:var(--pc,#6b4a2f);opacity:.28;pointer-events:none}
.tile.has{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset,0 12px 30px -16px var(--ac)}
.tw i.q{position:absolute;top:10px;right:10px;min-width:28px;height:28px;padding:0 7px;border-radius:10px;background:var(--ac);color:var(--on);font:700 14px/28px var(--f-m);text-align:center;font-style:normal;pointer-events:none;animation:pop .2s}
@keyframes pop{from{transform:scale(.4)}}
.minus{position:absolute;bottom:10px;right:10px;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:color-mix(in srgb,var(--bg) 80%,transparent);font-size:20px;line-height:1;z-index:2}
body.big .grid{grid-template-columns:repeat(auto-fill,minmax(185px,1fr))}
body.big .tile{min-height:164px}body.big .tile b{font-size:21px}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--dim)}
.search input{padding-left:42px}

.cbar{position:fixed;left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 24px));bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;gap:12px;border:0;border-radius:18px;padding:12px 16px 12px 12px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--on);font-weight:800;box-shadow:0 14px 34px -10px var(--ac2)}
.cbar .n{min-width:34px;height:34px;border-radius:11px;background:var(--on);color:var(--ac);display:grid;place-items:center;font:700 15px var(--f-m)}
.cbar .t{flex:1;text-align:left;line-height:1.1}
.cbar .t small{font-size:11px;font-weight:700;opacity:.7;text-transform:uppercase;letter-spacing:.08em}
.cbar .t b{font:700 19px var(--f-m)}

.ticket{background:var(--sf);border:1px solid var(--line);border-radius:24px;padding:18px;position:relative}
.ticket .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ticket .hd h2{margin:0;font-size:22px}
.ticket .hd span{font-size:13px;color:var(--mute)}
.cut{border:0;border-top:1.5px dashed var(--sf3);margin:14px -18px;position:relative}
.cut::before,.cut::after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;background:var(--bg)}
.cut::before{left:-9px}.cut::after{right:-9px}
.sheet .cut::before,.sheet .cut::after{background:var(--sf)}
.line{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 0}
.line b{font-size:15px}
.line small{font:500 13px var(--f-m);color:var(--mute)}
.step{display:flex;align-items:center;gap:4px;background:var(--sf2);border:1px solid var(--line);border-radius:12px;padding:3px}
.step button{width:32px;height:32px;border-radius:9px;border:0;background:none;font-size:18px;color:var(--mute)}
.step button:active{background:var(--sf3)}
.step output{min-width:22px;text-align:center;font:700 15px var(--f-m)}
.pays{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 4px}
.pays button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border:1px solid var(--line);border-radius:14px;background:var(--sf2);font-size:13px;font-weight:700;color:var(--mute)}
.pays button svg{width:22px;height:22px}
.pays button[aria-pressed="true"]{border-color:var(--ac);color:var(--ink);background:color-mix(in srgb,var(--ac) 12%,var(--sf2))}
.pays button[aria-pressed="true"] svg{color:var(--ac)}
.link{border:0;background:none;color:var(--ac);font-weight:700;font-size:14px;padding:6px 0}
.pkh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.pkt{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
.pkt b{font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.pkt .pill{margin:0}
.pkp{font-size:14px;font-weight:600;white-space:nowrap;padding-top:1px}
.pkn{margin:8px 0 0!important;padding-top:8px;border-top:1px solid var(--line)}
#s .bar{grid-template-columns:minmax(70px,112px) 1fr auto}
#s .two .btn{white-space:nowrap;padding-left:10px;padding-right:10px;gap:8px}
nav.dock .dl{display:block;white-space:nowrap}
@media (max-width:370px){nav.dock .dl{max-width:100%;overflow:hidden;text-overflow:ellipsis}nav.dock{gap:2px;padding:5px}nav.dock button{font-size:9.5px!important;letter-spacing:0!important;padding:8px 0!important}
  #s .two .btn{white-space:normal;line-height:1.15;font-size:14px;padding-left:8px;padding-right:8px;gap:6px}}
.add.tprow{grid-template-columns:minmax(0,1fr) 76px 48px}
.tprow select,.tprow .tq{min-width:0;width:100%;max-width:none!important}
.tprow .btn{width:48px;height:100%;min-height:48px;padding:0;display:grid;place-items:center}
.tprow .btn svg{width:18px;height:18px}
.sumr{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0;font-size:14px;color:var(--mute)}
.sumr span:last-child{font-family:var(--f-m)}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.tot span{font-weight:700}
.tot b{font:600 30px var(--f-m);letter-spacing:-.04em}
.chg{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--sf2);font-size:14px}
.chg b{font:600 17px var(--f-m)}
.chg.ok b{color:var(--ok)}.chg.bad b{color:var(--warn)}
.empty{padding:28px 10px 18px;text-align:center;color:var(--mute)}
.empty .mark{width:70px;height:45px;color:var(--sf3);margin:0 auto 12px;display:block}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.help{display:flex;gap:14px;align-items:flex-start;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 12%,var(--sf)),var(--sf) 60%);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:0 0 6px}
.help ol{margin:4px 0 0;padding-left:18px;color:var(--mute);font-size:14px}
.help ol b{color:var(--ink)}
.help .x2{margin-left:auto;border:0;background:var(--sf3);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700;flex:none}

/* ---------- Ringkasan ---------- */
.kpi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
@media (min-width:760px){.kpi{grid-template-columns:2fr repeat(3,minmax(0,1fr))}}
.kpi div{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.kpi .main{grid-column:1/-1;background:radial-gradient(120% 120% at 100% 0,color-mix(in srgb,var(--ac) 28%,transparent),transparent 60%),var(--sf);border-color:color-mix(in srgb,var(--ac) 35%,var(--line))}
@media (min-width:760px){.kpi .main{grid-column:auto;grid-row:span 2}}
.kpi span{display:block;font-size:11px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.1em}
.kpi b{display:block;font:600 21px var(--f-m);letter-spacing:-.03em;margin-top:6px;overflow:hidden;text-overflow:ellipsis}
.kpi .main b{font-size:clamp(30px,6vw,44px)}
.kpi em{font-style:normal;font-size:13px;font-weight:700}
.up{color:var(--ok)}.down{color:var(--warn)}
.chart{max-width:820px;background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 6px}
.chart svg{display:block;width:100%;height:auto}
.chart text{font:600 11px var(--f-b);fill:var(--mute)}
.chart .v{font:600 11px var(--f-m);fill:var(--ink)}
.cols{display:grid;gap:0 28px}
@media (min-width:900px){.cols{grid-template-columns:1fr 1fr}}
.bar{display:grid;grid-template-columns:100px 1fr auto;gap:10px;align-items:center;padding:6px 0;font-size:14px}

/* ---------- Stok, Menu, Atur ---------- */

.meter i.lo{background:var(--warn)}
.mrow{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}

.folder span{flex:1;min-width:0}.folder b{display:block;font:800 17px var(--f-d)}.folder small{color:var(--mute)}
.folder > svg:last-child{color:var(--mute)}
.sortable{display:grid;gap:10px}
.list.sortable{gap:0}
.srow{display:flex;align-items:stretch;gap:8px;position:relative}
.srow .folder{margin:0;flex:1;min-width:0}
.grip{flex:none;width:42px;border:1px solid var(--line);background:var(--sf);border-radius:14px;color:var(--mute);touch-action:none;cursor:grab;display:grid;place-items:center;padding:0}

body.dragmode{user-select:none;-webkit-user-select:none}
.greet p svg.i{width:16px;height:16px;vertical-align:-3px;fill:currentColor}
.rbook{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:6px 0 4px}
.rcard{background:var(--sf2);border:1px solid var(--line);border-top:4px solid var(--pc);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}

.steps{margin:0;font-size:13px;color:var(--mute);white-space:pre-line;background:var(--sf);border-radius:10px;padding:8px 10px}
.rcard footer{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:auto;font-size:13px;color:var(--mute)}
.rcard footer b{color:var(--ink)}
.rr3{display:grid;grid-template-columns:minmax(0,1fr) 92px minmax(0,1.1fr);gap:8px;align-items:start}
.rr3 .btn{margin:4px 0 10px}
.rr{display:grid;grid-template-columns:1fr 84px 40px;gap:8px;align-items:center}
.rr button{border:0;background:none;color:var(--warn);font-size:18px}
.tag{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:999px;padding:5px 4px 5px 12px;background:var(--bg);font-size:14px}

@media (min-width:960px){.setg{grid-template-columns:1fr 1fr;align-items:start}}
.note{font-size:13px;color:var(--mute);margin:4px 0 8px}

.qbox::before{top:10px;left:10px;border-right:0;border-bottom:0;border-top-left-radius:14px}

pre.prt{background:#f4efe6;color:#1b1410;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;padding:14px;border-radius:12px;overflow-x:auto;white-space:pre}
textarea{font:12px ui-monospace,Menlo,Consolas,monospace}

@keyframes cup{from{transform:translateY(60%) scale(.96);opacity:0}}
@keyframes cdown{to{transform:translateY(40px) scale(.97);opacity:0}}

.cglow{position:absolute;inset:-40% -20% auto;height:70%;background:radial-gradient(closest-side,color-mix(in srgb,var(--ac) 22%,transparent),transparent);pointer-events:none;animation:cglow 8s ease-in-out infinite alternate;opacity:.7}

.chd{position:relative;display:flex;align-items:center;gap:12px;padding:14px 14px 12px 16px}

.chd .pv-who b{font:800 17px var(--f-d);letter-spacing:-.01em}

.cmode i{width:7px;height:7px;border-radius:50%;background:var(--mute)}.cmode i.on{background:#3ddc84;box-shadow:0 0 0 0 rgba(61,220,132,.6);animation:cping 2s infinite}

.chb{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--sf2) 80%,transparent);color:var(--ink);display:grid;place-items:center;padding:0;transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .2s}

.chb:hover{background:var(--sf3)}.chb:active{transform:scale(.88)}.chb[data-a=c_clear]:active svg{transform:rotate(-200deg);transition:transform .4s}
.cmsgs{position:relative;flex:1;overflow:auto;padding:16px 14px 10px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain;scroll-behavior:smooth}

.cm.ai b{color:var(--ac);font-weight:800}
.cav{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(140deg,#C8502E,#9C3A1E);border:0}

.steam i{width:4px;height:20px;border-radius:4px;background:linear-gradient(transparent,color-mix(in srgb,var(--ink) 45%,transparent));filter:blur(1.5px);opacity:0;animation:csteam 2.6s ease-in-out infinite}.steam i:nth-child(2){animation-delay:.6s}.steam i:nth-child(3){animation-delay:1.2s}

.csug{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin-top:14px}

.cin{padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px))}

.cfab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;flex-direction:row-reverse;gap:0;height:60px;padding:0;border:0;border-radius:30px;background:linear-gradient(140deg,var(--ac) 0%,var(--ac2) 100%);color:var(--on);box-shadow:0 14px 32px -10px var(--ac),0 0 0 1px color-mix(in srgb,#fff 18%,transparent) inset;transition:bottom .45s cubic-bezier(.2,1.2,.3,1),transform .3s cubic-bezier(.3,1.6,.5,1),box-shadow .3s;animation:cfabIn .6s cubic-bezier(.2,1.4,.4,1) both;-webkit-tap-highlight-color:transparent}

/* ---------- Tema terang & efek kaca ---------- */

/* ---------- CTA Pesan sekarang (animasi menarik) ---------- */
@keyframes flow{from{background-position:0% 0}to{background-position:220% 0}}

@keyframes breatheBtn{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@keyframes steam{0%{transform:translateY(3px);opacity:0}40%{opacity:.9}100%{transform:translateY(-6px);opacity:0}}
@keyframes badgePop{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.1) rotate(3deg)}}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes fabIn{0%{transform:translateY(120px) scale(.6);opacity:0}70%{transform:translateY(-8px) scale(1.05);opacity:1}100%{transform:none}}
@keyframes wiggle{0%,84%,100%{transform:rotate(0)}87%{transform:rotate(-9deg) scale(1.08)}90%{transform:rotate(8deg) scale(1.08)}93%{transform:rotate(-5deg)}96%{transform:rotate(3deg)}}

.k-order{position:relative;overflow:hidden;isolation:isolate;background:linear-gradient(110deg,var(--ac) 0%,var(--ac2) 45%,var(--ac) 90%);background-size:220% 100%;animation:flow 9s linear infinite,ringOut 3.2s ease-out 1.8s infinite}
/* Pixel wipe: mosaik kecil yang membuka tombol, lalu gelombang piksel halus berkala */
.pxw{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--pc),1fr);grid-template-rows:repeat(var(--pr),1fr);pointer-events:none;z-index:3}
.pxw i{display:block;opacity:0;animation:pxIn .55s cubic-bezier(.4,0,.2,1) var(--d) both,pxWave 7s cubic-bezier(.4,0,.2,1) calc(var(--d) + 1.6s) infinite}
.pxw i.h{--hl:1}
@keyframes pxIn{0%{opacity:1;background:var(--bg);transform:scale(1)}60%{opacity:1;background:color-mix(in srgb,var(--bg) 55%,var(--ac))}100%{opacity:0;background:var(--ac);transform:scale(.4)}}
@keyframes pxWave{0%,100%{opacity:0;transform:scale(.3)}3%{opacity:1;transform:scale(1);background:color-mix(in srgb,var(--on) 26%,transparent)}6%{opacity:.9;background:rgba(255,255,255,.55)}10%{opacity:0;transform:scale(.3)}}
.pxw i.h{animation-name:pxIn,pxWaveH}
.pxw.nw i{animation:pxWave 7s cubic-bezier(.4,0,.2,1) var(--d) infinite}
.pxw.nw i.h{animation-name:pxWaveH}
@keyframes pxWaveH{0%,100%{opacity:0;transform:scale(.3)}3%{opacity:1;transform:scale(1);background:rgba(255,255,255,.85)}7%{opacity:.6;background:color-mix(in srgb,var(--red) 40%,transparent)}11%{opacity:0;transform:scale(.3)}}

.mhero{position:relative;margin:18px 0 14px;padding:20px;border-radius:26px;overflow:hidden;background:radial-gradient(90% 120% at 100% 0,color-mix(in srgb,var(--red) 40%,transparent),transparent 60%),radial-gradient(70% 90% at 0 100%,color-mix(in srgb,var(--ac) 16%,transparent),transparent 65%),var(--sf);border:1px solid var(--line)}
.mhero h2{margin:6px 0 6px;font-size:clamp(24px,5.4vw,34px)}
.mhero p{margin:0;color:var(--mute);font-size:14px}
.mhero p svg.i{width:15px;height:15px;vertical-align:-3px;fill:currentColor}
.mstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0 14px}
.mstats div{background:color-mix(in srgb,var(--bg) 55%,transparent);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.mstats b{display:block;font:700 18px var(--f-m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mstats div:last-child b{font-size:14px;line-height:1.2;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mstats span{display:block;font-size:11px;color:var(--mute);line-height:1.25;margin-top:2px}
.mact{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mcards{display:grid;gap:12px}
.mcard{position:relative;display:flex;align-items:stretch;gap:8px;animation:fadeUp .5s cubic-bezier(.22,1,.36,1) var(--d) both}
.mcard.off .mc-main{opacity:.6}
.mc-main{flex:1;min-width:0;display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;padding:12px;text-align:left;border-radius:22px;border:1px solid var(--line);background:radial-gradient(120% 100% at 0 0,color-mix(in srgb,var(--pc) 22%,transparent),transparent 55%),var(--sf);transition:border-color .2s,transform .15s,box-shadow .2s}
.mc-main:hover{border-color:color-mix(in srgb,var(--pc) 70%,var(--line));box-shadow:0 18px 40px -26px var(--pc)}
.mc-main:active{transform:scale(.985)}
.mc-art{position:relative;border-radius:16px;overflow:hidden;background:linear-gradient(160deg,color-mix(in srgb,var(--pc) 85%,#fff 15%),color-mix(in srgb,var(--pc) 60%,#000 40%));display:grid;place-items:center;min-height:118px}
.mc-art::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 50% at 30% 20%,rgba(255,255,255,.35),transparent 70%)}
.mc-art::after{content:"";position:absolute;left:-30%;top:0;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);transform:skewX(-18deg);animation:mcSheen 5s ease-in-out infinite;animation-delay:var(--d)}
@keyframes mcSheen{0%,70%{left:-40%}100%{left:130%}}
.mc-art span{position:relative;font:900 44px/1 var(--f-d);font-stretch:125%;letter-spacing:-.06em;color:rgba(255,255,255,.92);text-shadow:0 6px 20px rgba(0,0,0,.25)}
.mc-body{display:flex;flex-direction:column;gap:6px;min-width:0}
.mc-tags{display:flex;flex-wrap:wrap;gap:5px}
.mc-tags em{font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--sf2);color:var(--mute);border:1px solid var(--line)}
.mc-tags em.x{color:var(--warn)}
.mc-name{font:800 21px/1.1 var(--f-d);font-stretch:110%;letter-spacing:-.015em}
.fpills{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:2px 0}
.fpills span{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--pc,var(--ac)) 18%,var(--sf2));border:1px solid color-mix(in srgb,var(--pc,var(--ac)) 35%,var(--line));color:var(--ink)}
.fpills i{font-style:normal;color:var(--dim);font-weight:800;font-size:12px}
.mc-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:auto;flex-wrap:wrap}
.mc-price{font:700 20px var(--f-m);letter-spacing:-.03em}
.mc-mg{display:grid;gap:4px;min-width:130px;flex:1;max-width:220px}
.mc-bar{height:6px;border-radius:999px;background:var(--sf3);overflow:hidden}
.mc-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--ac2),var(--ac));animation:mcGrow 1s cubic-bezier(.22,1,.36,1) calc(var(--d) + .2s) both}
@keyframes mcGrow{from{width:0}}
.mc-mg small{font-size:11.5px;color:var(--mute)}.mc-mg small b{color:var(--ink);font-family:var(--f-m)}
.mc-side{display:flex;flex-direction:column;gap:8px}
.mc-edit{flex:1;width:42px;border:1px solid var(--line);background:var(--sf);border-radius:14px;color:var(--mute);display:grid;place-items:center;padding:0}
.mc-edit:hover{color:var(--ink);border-color:var(--sf3)}
.mc-side .grip{flex:1}
@media (min-width:640px){.mc-main{grid-template-columns:132px minmax(0,1fr);padding:14px}.mc-art{min-height:140px}.mc-art span{font-size:56px}}
/* lembar resep */
.rhead{display:flex;align-items:center;gap:14px;margin:0 40px 12px 0}
.rgl{width:64px;height:64px;flex:none;border-radius:18px;display:grid;place-items:center;font:900 26px var(--f-d);color:#fff;background:linear-gradient(160deg,color-mix(in srgb,var(--pc) 85%,#fff 15%),color-mix(in srgb,var(--pc) 60%,#000 40%))}
.szs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:6px -18px 12px;padding:0 18px}
.szs::-webkit-scrollbar{display:none}
.szs button{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:74px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--sf2);font:700 15px var(--f-m);color:var(--mute)}
.szs button small{font:700 9.5px var(--f-b);letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.szs button[aria-selected="true"]{background:var(--ac);color:var(--on);border-color:var(--ac);box-shadow:0 10px 24px -12px var(--ac)}
.rbig{background:var(--sf2);border:1px solid var(--line);border-radius:18px;padding:4px 16px;animation:fadeUp .3s both}
.rrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px dashed var(--line)}
.rrow:last-child{border-bottom:0}
.rrow span{font-weight:700;font-size:16px}.rrow span small{display:block;font-weight:500;color:var(--mute);font-size:12px}
.rrow b{font:700 24px var(--f-m);letter-spacing:-.03em;text-align:right}.rrow b small{display:block;font:600 12px var(--f-m);color:var(--ac);letter-spacing:0}
:root[data-ui="light"] .rrow b small{color:var(--red)}
.rall{margin-top:12px}.rall summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--ac);padding:6px 0}
:root[data-ui="light"] .rall summary{color:var(--red)}
.rtw,.btw{overflow-x:auto;margin:6px -18px 0;padding:0 18px}
.rtab{border-collapse:collapse;width:100%;min-width:520px;font-size:13.5px}
.rtab th,.rtab td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-family:var(--f-m)}
.rtab thead th{font:700 12px var(--f-b);color:var(--mute);vertical-align:bottom}
.rtab thead th small,.rtab td small{display:block;font-size:10.5px;color:var(--mute);font-weight:500}
.rtab tbody th{text-align:left;font-family:var(--f-b)}
.rtab th:nth-child(2),.rtab td:nth-child(2){background:color-mix(in srgb,var(--ac) 10%,transparent)}
.rnotes{margin-top:12px;display:grid;gap:6px}
.rtab .nil{color:var(--dim)}
.rnotes p{display:flex;gap:8px;align-items:flex-start;margin:0;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--ac) 8%,var(--sf2));border:1px solid var(--line);font-size:13.5px;font-weight:600}
.rnotes svg{width:16px;height:16px;flex:none;color:var(--ac);margin-top:1px}
.bted{border-collapse:separate;border-spacing:4px;min-width:620px}
.bted input{margin:0;padding:8px;font-size:13px;border-radius:9px;min-width:70px}
.bted th input{font-weight:700}.bted thead input{text-align:center;font-family:var(--f-m)}
.bted td button{border:0;background:none;color:var(--warn);font-size:16px}
/* Menu publik tersambung kasir */
.k-mcat{margin:14px 0 2px;font:700 11px var(--f-b);letter-spacing:.14em;text-transform:uppercase;color:var(--ac)}
:root[data-ui="light"] .k-mcat{color:var(--red)}
.k-mi{align-items:center}
.k-mdot{width:10px;height:28px;border-radius:5px;background:var(--pc);flex:none;box-shadow:0 0 14px -2px var(--pc)}
.k-mn{display:flex;flex-direction:column;min-width:0;flex:0 1 auto}
.k-mn b{display:inline}.k-mn .k-sold{align-self:flex-start;margin-top:3px}
.k-mn small{font-size:12px;color:var(--mute);margin-top:2px;line-height:1.3}
.k-mn .k-md{font-size:13px;color:color-mix(in srgb,var(--ink) 72%,transparent);margin-top:3px;line-height:1.4;max-width:34ch}
.k-mi .k-mp{font:600 15px var(--f-m);white-space:nowrap}
.k-mi.out .k-mdot{opacity:.35}
/* ---------- Sinkron tim ---------- */
.tjoin{display:grid;gap:6px;margin:0 0 14px;padding:14px;border-radius:16px;background:color-mix(in srgb,var(--ac) 10%,var(--sf));border:1px solid color-mix(in srgb,var(--ac) 40%,var(--line))}
.tjoin small{color:var(--mute)}.tjoin .add{margin-top:4px}.tjoin input{margin:0;text-transform:uppercase;font-family:var(--f-m);letter-spacing:.06em}
.tok{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:13px;font-weight:600;color:var(--ok)}.tok svg{width:16px;height:16px}
.tcode{display:grid;gap:8px;justify-items:start;padding:16px;border-radius:18px;background:var(--sf2);border:1px dashed color-mix(in srgb,var(--ac) 60%,var(--line));margin-bottom:12px}
.tcode small{font:700 11px var(--f-b);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.tcode b{font:700 30px var(--f-m);letter-spacing:.06em;user-select:all}
.tsteps{display:grid;gap:8px;margin:12px 0}
.tsteps p{display:flex;gap:10px;align-items:flex-start;margin:0;font-size:14px}
.tsteps p > b{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--ac);color:var(--on);font:700 13px var(--f-m)}
/* ---------- Transaksi tim ---------- */
.rtl{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:13.5px;font-weight:600}
.rtl i{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:rtPulse 2s infinite;flex:none}
.rtl.wait i{background:var(--warn);animation:none}
@keyframes rtPulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.ttx .btn{margin-top:10px}
/* ---------- Welcome ---------- */
html.hi-on,html.hi-on body{overflow:hidden}
.hi{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#0a0302;color:#fff;cursor:pointer;overflow:hidden;-webkit-tap-highlight-color:transparent}
:root[data-ui="light"] .hi{background:#fbf6f1;color:#1f0b05}
.hi-glow{position:absolute;inset:-20%;background:radial-gradient(38% 30% at 50% 41.6%,color-mix(in srgb,var(--red) 55%,transparent),transparent 70%),radial-gradient(30% 24% at 50% 46%,color-mix(in srgb,var(--lime) 18%,transparent),transparent 70%);opacity:0;animation:hiGlow 4s cubic-bezier(.22,1,.36,1) 0.25s both}
@keyframes hiGlow{0%{opacity:0;transform:scale(.7)}45%{opacity:1}100%{opacity:.75;transform:scale(1.08)}}
.hi-pos{position:absolute;left:50%;top:38.2%;transform:translate(-50%,-38.2%)}
/* Golden ratio φ=1.618: lebar logo = lebar judul ÷ φ, jarak logo→judul = tinggi logo ÷ φ³, ukuran teks turun ÷ φ per tingkat */
.hi-c{--F:calc(clamp(32px,8.4vw,60px)*var(--fs,1));position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 24px;will-change:transform}
.hi-logo{position:relative;width:calc(var(--F)*4.1);aspect-ratio:1565/1015;animation:hiLogo 2s cubic-bezier(.22,1,.36,1) 0.125s both}
@keyframes hiLogo{from{transform:scale(.86);filter:blur(8px)}to{transform:none;filter:none}}
.hi-logo svg{width:100%;height:100%;overflow:visible}
.hi-stroke path{fill:none;stroke:var(--lime);stroke-width:7;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:hiDraw 1.44s cubic-bezier(.65,0,.35,1) calc(0.312s + var(--i)*0.15s) forwards,hiFade 0.625s ease 1.94s forwards}
:root[data-ui="light"] .hi-stroke path{stroke:var(--red)}
@keyframes hiDraw{to{stroke-dashoffset:0}}
@keyframes hiFade{to{opacity:0}}
.hi-fill path{fill:var(--lime);opacity:0;animation:hiFill 0.875s cubic-bezier(.22,1,.36,1) calc(1.31s + var(--i)*0.075s) forwards}
:root[data-ui="light"] .hi-fill path{fill:var(--red)}
@keyframes hiFill{to{opacity:1}}
.hi-sh{transform:translateX(0) skewX(-18deg);opacity:.85;animation:hiSheen 1.38s cubic-bezier(.65,0,.35,1) 2.19s both}
@keyframes hiSheen{from{transform:translateX(0) skewX(-18deg)}to{transform:translateX(2100px) skewX(-18deg)}}
.hi-t{margin:calc(var(--F)*.618) 0 0;font:800 var(--F)/1 var(--f-d);font-stretch:112%;letter-spacing:-.035em;white-space:nowrap}
.hi-t span{display:inline-block;opacity:0;transform:translateY(.45em);filter:blur(10px);animation:hiChar 1.12s cubic-bezier(.22,1,.36,1) var(--d) forwards}
@keyframes hiChar{to{opacity:1;transform:none;filter:none}}
.hi-t{background:linear-gradient(180deg,currentColor 55%,color-mix(in srgb,currentColor 55%,transparent));-webkit-background-clip:text;background-clip:text}
.hi-s{margin:calc(var(--F)*.382) 0 0;font:500 max(15px,calc(var(--F)*.382)) var(--f-b);color:color-mix(in srgb,currentColor 62%,transparent);opacity:0;animation:hiUp 1.12s cubic-bezier(.22,1,.36,1) 2.69s forwards}
.hi-s b{color:currentColor;font-weight:700;color:inherit}
:root:not([data-ui="light"]) .hi-s b{color:#fff}
.hi-g{margin:calc(var(--F)*.236) 0 0;font:500 max(12px,calc(var(--F)*.236)) var(--f-b);letter-spacing:.02em;color:var(--lime);opacity:0;animation:hiUp 1.12s cubic-bezier(.22,1,.36,1) 2.94s forwards}
:root[data-ui="light"] .hi-g{color:var(--red)}
@keyframes hiUp{from{opacity:0;transform:translateY(10px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.hi-skip{position:absolute;right:18px;bottom:calc(20px + env(safe-area-inset-bottom,0px));border:1px solid color-mix(in srgb,currentColor 22%,transparent);background:color-mix(in srgb,currentColor 6%,transparent);color:inherit;border-radius:999px;padding:8px 16px;font:600 13px var(--f-b);opacity:0;animation:hiUp 0.75s ease 1s forwards;backdrop-filter:blur(10px)}
.hi.out{pointer-events:none;animation:hiOut 1.25s cubic-bezier(.7,0,.2,1) forwards}
.hi.out .hi-c{animation:hiZoom 1.25s cubic-bezier(.7,0,.2,1) forwards}
.hi.out .hi-skip{opacity:0!important;transition:opacity 0.25s}
@keyframes hiZoom{0%{transform:none;opacity:1;filter:none}100%{transform:scale(2.6);opacity:0;filter:blur(14px)}}
@keyframes hiOut{0%,25%{opacity:1}100%{opacity:0}}
#pub.hi-in{animation:hiPage 1.38s cubic-bezier(.22,1,.36,1) both}
@keyframes hiPage{from{transform:scale(.94);filter:blur(12px);opacity:.3}to{transform:none;filter:none;opacity:1}}
/* Preview layar pembuka (ponsel virtual 390×760, diperkecil) */
.hiframe{position:relative;width:234px;height:456px;margin:14px auto 6px;border-radius:30px;overflow:hidden;border:6px solid var(--sf3);background:#0a0302;box-shadow:0 24px 50px -24px rgba(0,0,0,.8)}
.hibox{position:absolute;left:0;top:0;width:390px;height:760px;transform:scale(.6);transform-origin:0 0}
.hi.prev{position:absolute;z-index:1}
.hi.prev .hi-c{--F:calc(32.76px*var(--fs,1))}
.hiframe .hiagain{position:absolute;inset:0;z-index:2;display:none;place-items:center;border:0;background:rgba(10,3,2,.55);color:#fff;font:700 14px var(--f-b);cursor:pointer}
.hiframe.ended .hiagain{display:grid}
.hiframe .hiagain span{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--ac);color:var(--on)}
.rng{display:flex;align-items:center;gap:12px}
.rng input[type=range]{flex:1;margin:6px 0;padding:0;border:0;background:none;accent-color:var(--ac)}
.rng output{min-width:52px;text-align:right;font:600 15px var(--f-m)}
/* ---------- Transisi tema ---------- */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){animation:themeReveal .75s cubic-bezier(.65,0,.35,1) both}
@keyframes themeReveal{from{clip-path:circle(0 at var(--tx,90%) var(--ty,40px))}to{clip-path:circle(var(--tr,150vmax) at var(--tx,90%) var(--ty,40px))}}
html.theming,html.theming *,html.theming *::before,html.theming *::after{transition:background-color .6s ease,color .6s ease,border-color .6s ease,fill .6s ease,stroke .6s ease,box-shadow .6s ease!important}
.uitog svg.spin{animation:themeSpin .7s cubic-bezier(.2,1.3,.4,1)}
@keyframes themeSpin{from{transform:rotate(-120deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
/* ---------- Habis (stok kosong) ---------- */
.soldb{position:absolute;bottom:10px;right:10px;z-index:2;height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:color-mix(in srgb,var(--bg) 78%,transparent);color:var(--mute);font:700 12px var(--f-b);backdrop-filter:blur(6px)}
.soldb:hover{color:var(--ink);border-color:var(--sf3)}
.soldb.on{background:var(--ac);color:var(--on);border-color:transparent}
.tile.out{filter:grayscale(.85);opacity:.55;cursor:not-allowed}
.tile.out .pr{text-decoration:line-through}
.tile .stamp{position:absolute;top:50%;left:50%;z-index:2;transform:translate(-50%,-60%) rotate(-12deg);padding:4px 12px;border:2px solid var(--red);border-radius:8px;color:var(--red);font:900 18px var(--f-d);letter-spacing:.12em;text-transform:uppercase;background:color-mix(in srgb,var(--bg) 60%,transparent)}
.k-mi.out b,.k-mi.out span{opacity:.45}.k-mi.out span{text-decoration:line-through}
.k-sold{font:800 10px var(--f-b);font-style:normal;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--red2);color:#fff;align-self:center}
/* ---------- Pixel swap (CTA + FAB) ---------- */
.sw{--cy:8s;--o:0s}
.k-order.sw{min-height:60px}
.sw > .fc{position:absolute!important;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--on)}
.sw > .fa{animation:faceA var(--cy) linear var(--o) infinite}
.sw > .fb{clip-path:inset(0 100% 0 0);animation:faceB var(--cy) linear var(--o) infinite}
.k-order .lbl,.k-fab .lbl{margin:0;line-height:1.2;text-align:center}
.sw > .fc{text-align:center}
.k-order.sw > .fb .lbl{font-size:16px}
.obn{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 7px;border-radius:999px;background:var(--red2);color:#fff;font:800 14px var(--f-m);box-shadow:0 0 0 2px color-mix(in srgb,var(--red) 60%,transparent)}
@keyframes faceA{0%,40%{clip-path:inset(0 0 0 0)}53.75%{clip-path:inset(0 0 0 100%)}53.76%,86.25%{clip-path:inset(0 100% 0 0)}100%{clip-path:inset(0 0 0 0)}}
@keyframes faceB{0%,40%{clip-path:inset(0 100% 0 0)}53.75%,86.25%{clip-path:inset(0 0 0 0)}99.99%{clip-path:inset(0 0 0 100%)}100%{clip-path:inset(0 100% 0 0)}}
.pxs{position:absolute!important;inset:0;z-index:3;display:grid;grid-template-columns:repeat(var(--pc),1fr);grid-template-rows:repeat(var(--pr),1fr);pointer-events:none}
.pxs i{display:block;opacity:0;background:var(--red);animation:pxSw var(--cy) linear calc(var(--o) + var(--s)) infinite}
.pxs i.l{background:var(--lime);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.pxs i.d{background:var(--red2)}
@keyframes pxSw{0%,38.9%,43.2%,85.1%,89.5%,100%{opacity:0;transform:scale(.35)}40%,41.2%,86.3%,87.5%{opacity:1;transform:scale(1)}}
.k-fab.sw{width:60px;height:60px;padding:0;justify-content:center;border-radius:50%;--o:2s}
.k-fab.sw .cupst,.k-fab.sw svg.i{width:26px;height:26px;stroke-width:2}
@media (prefers-reduced-motion:reduce){.sw > .fb{display:none}}
.k-order.sw .pxw.nw{display:none}
.k-order.sw .pxw i,.k-order.sw .pxw i.h{animation-name:pxIn;animation-iteration-count:1}

}

const UF={ml:1,l:1000,g:1,kg:1000,pcs:1},UL={ml:"ml",l:"liter",g:"gram",kg:"kg",pcs:"pcs"},USH={ml:"ml",l:"L",g:"g",kg:"kg",pcs:"pcs"};

const BT_SVCS=["000018f0-0000-1000-8000-00805f9b34fb","0000ff00-0000-1000-8000-00805f9b34fb","0000ffe0-0000-1000-8000-00805f9b34fb","0000fee7-0000-1000-8000-00805f9b34fb","e7810a71-73ae-499d-8c15-faa9aef0c3f2","49535343-fe7d-4ae5-8fa9-9fafd205e455"];
let BT=null,btMsg="";
const btOK=()=>!!(BT&&BT.ch&&BT.dev&&BT.dev.gatt&&BT.dev.gatt.connected);
async function btConnect(){
  if(!navigator.bluetooth){btMsg=window.A521?"Cetak Bluetooth langsung belum tersedia di aplikasi ini. Pakai cara salin ke aplikasi printer di bawah.":"Bluetooth tidak tersedia di tampilan ini. Di dalam aplikasi Claude, halaman tidak diberi izin Bluetooth. Pakai cara salin ke aplikasi printer di bawah.";render();return}
  try{
    const dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:BT_SVCS});
    btMsg="Menyambungkan ke "+(dev.name||"printer")+"…";render();
    const srv=await dev.gatt.connect();let ch=null;
    for(const s of await srv.getPrimaryServices()){for(const c of await s.getCharacteristics()){if(c.properties.write||c.properties.writeWithoutResponse){ch=c;break}}if(ch)break}
    if(!ch)throw{name:"NoChar"};
    BT={dev,ch};dev.addEventListener("gattserverdisconnected",()=>{btMsg="Printer terputus.";render()});btMsg="";toast("Tersambung ke "+(dev.name||"printer"),1);render();
  }catch(e){const n=e&&e.name;btMsg=n==="NotFoundError"?"Tidak ada printer yang dipilih.":n==="SecurityError"||n==="NotAllowedError"?"Bluetooth diblokir di tampilan ini. Pakai cara salin ke aplikasi printer di bawah.":n==="NoChar"?"Perangkat tersambung, tapi bukan printer thermal yang dikenali.":"Gagal menyambung: "+(e&&e.message||"coba lagi.");render()}
}
async function btPrint(text){
  const ascii=String(text).normalize("NFKD").replace(/[^\x0a\x20-\x7e]/g,"");
  const enc=new TextEncoder().encode(ascii),data=new Uint8Array(enc.length+7);
  data.set([27,64],0);data.set(enc,2);data.set([10,29,86,66,0],enc.length+2);
  for(let i=0;i<data.length;i+=100){const part=data.slice(i,i+100);if(BT.ch.properties.writeWithoutResponse)await BT.ch.writeValueWithoutResponse(part);else await BT.ch.writeValue(part)}
}

let drag=null;
function applySort(key,order){
  if(key==="set")C().setOrder=order;
  else if(key==="cats")C().cats=order;
  else if(key==="prod"){const m=Object.fromEntries(D.prod.map(p=>[p.id,p]));D.prod=order.map(i=>m[i]).filter(Boolean).concat(D.prod.filter(p=>!order.includes(p.id)))}

document.addEventListener("pointerdown",e=>{
  const g=e.target.closest(".grip");if(!g)return;const row=g.closest("[data-si]"),box=row&&row.parentElement;if(!box||!box.dataset.sort)return;
  e.preventDefault();try{g.setPointerCapture(e.pointerId)}catch(x){}
  drag={row,box,key:box.dataset.sort,y0:e.clientY,start:[...box.children].map(x=>x.dataset.si).join("|")};row.classList.add("dragging");document.body.classList.add("dragmode");
});
document.addEventListener("pointermove",e=>{
  if(!drag)return;e.preventDefault();const {row,box}=drag,y=e.clientY,cur=parseFloat(row.dataset.ty||0),baseTop=row.getBoundingClientRect().top-cur;
  let before=null;for(const s of box.children){if(s===row)continue;const r=s.getBoundingClientRect();if(y<r.top+r.height/2){before=s;break}}
  if(before!==row.nextElementSibling&&before!==row){box.insertBefore(row,before);const nt=row.getBoundingClientRect().top-cur;drag.y0+=nt-baseTop}
  const ty=y-drag.y0;row.style.transform=`translateY(${ty}px)`;row.dataset.ty=ty;
},{passive:false});
function endDrag(){if(!drag)return;const {row,box,key,start}=drag;row.style.transform="";delete row.dataset.ty;row.classList.remove("dragging");document.body.classList.remove("dragmode");drag=null;
  const order=[...box.children].map(x=>x.dataset.si);if(order.join("|")!==start){applySort(key,order);toast("Urutan disimpan",1)}}
document.addEventListener("pointerup",endDrag);document.addEventListener("pointercancel",endDrag);
document.addEventListener("keydown",e=>{
  const g=e.target.closest&&e.target.closest(".grip");if(!g||(e.key!=="ArrowUp"&&e.key!=="ArrowDown"))return;e.preventDefault();
  const row=g.closest("[data-si]"),box=row.parentElement,ids=[...box.children].map(x=>x.dataset.si),i=ids.indexOf(row.dataset.si),j=i+(e.key==="ArrowUp"?-1:1);if(j<0||j>=ids.length)return;
  [ids[i],ids[j]]=[ids[j],ids[i]];const key=box.dataset.sort,id=row.dataset.si;applySort(key,ids);const ng=[...document.querySelectorAll(`[data-sort="${key}"] > [data-si]`)].find(x=>x.dataset.si===id);if(ng)ng.querySelector(".grip").focus();
});

/* ===== Langganan (paket kuota cup) =====
   Jenis paket (C().subPk) dibuat Owner: isi per menu atau "Menu bebas", harga, masa berlaku.
   Pelanggan (D.mem) dikenali dari nomor HP. Setiap paket menyimpan pemakaian per transaksi (pack.u[txKey]),

let subM="",mq="",msel=null,spk=null,medit=null;
const hpN=v=>{let s=String(v||"").replace(/\D/g,"");if(s.startsWith("62"))s="0"+s.slice(2);else if(s.startsWith("8"))s="0"+s;return s};
const hpWa=h=>"62"+hpN(h).slice(1);
const memBy=id=>D.mem.find(m=>m.id===id);
const memOn=()=>D.mem.filter(m=>!m.del);
const memByHp=h=>{h=hpN(h);return h?D.mem.find(m=>m.hp===h&&!m.del):null};
const pkUsed=(k,i)=>Object.values(k.u||{}).reduce((s,e)=>s+e.filter(x=>x[0]===i).reduce((a,x)=>a+x[1],0),0);
const pkLeft=(k,i)=>Math.max(0,((k.items||[])[i]||{}).q-pkUsed(k,i));
const pkLeftAll=k=>(k.items||[]).reduce((s,_,i)=>s+pkLeft(k,i),0);
const pkExp=k=>!!(k.exp&&k.exp<ymd(new Date()));
const pkLive=k=>!k.x&&!k.stub&&!pkExp(k)&&pkLeftAll(k)>0;
const memLive=m=>(m.packs||[]).filter(pkLive).sort((a,b)=>(a.exp||"9")<(b.exp||"9")?-1:(a.exp||"9")>(b.exp||"9")?1:a.buy<b.buy?-1:1);
const memLeft=m=>memLive(m).reduce((s,k)=>s+pkLeftAll(k),0);
const pkItemTxt=(k,showLeft)=>(k.items||[]).map((it,i)=>`${esc(it.n)} ${showLeft?pkLeft(k,i)+"/"+it.q:"×"+it.q}`).join(" · ");
const expTxt=e=>e?"s/d "+kFmt(e):"tanpa batas waktu";
function memUpsert(id,hp,nm){let m=memBy(id);if(!m){m={id,hp:hpN(hp),name:nm||"",at:iso(),packs:[]};D.mem.push(m)}if(nm&&!m.name)m.name=nm;if(hp&&!m.hp)m.hp=hpN(hp);return m}
function pkFind(m,id){return (m.packs||[]).find(k=>k.id===id)}
/* Satu transaksi → buku langganan (dipakai saat jual, ambil, batal, dan saat menerima transaksi dari HP lain) */
function memFromTx(t){
  const s=t&&t.sub;if(!s||!s.m)return;const m=memUpsert(s.m,s.hp,s.nm),key=txKey(t),off=t.status==="cancelled";
  if(s.sale&&s.pack){let k=pkFind(m,s.pack.id);if(!k){k=Object.assign({u:{}},JSON.parse(JSON.stringify(s.pack)));m.packs.push(k)}else if(k.stub){const u=k.u;Object.assign(k,JSON.parse(JSON.stringify(s.pack)));k.u=u;delete k.stub}
    k.tx=key;if(off)k.x=1;return}
  const g={};(s.uses||[]).forEach(([pid,i,q])=>{(g[pid]=g[pid]||[]).push([i,q])});
  Object.entries(g).forEach(([pid,e])=>{let k=pkFind(m,pid);if(!k){k={id:pid,name:"Paket (menunggu data)",items:[],u:{},stub:1};m.packs.push(k)}k.u=k.u||{};if(off)delete k.u[key];else k.u[key]=e});
}
/* Data dari Owner (sinkron tim): gabung, jangan timpa pemakaian yang sudah tercatat di HP ini */
function memMerge(list){
  const dead=new Set(D.tx.filter(t=>t.status==="cancelled").map(txKey));
  (list||[]).forEach(r=>{if(!r||!r.id)return;const m=memUpsert(r.id,r.hp,r.name);if(r.ed||m.ed){if((r.ed||"")>(m.ed||"")){m.name=r.name||"";m.hp=hpN(r.hp);m.ed=r.ed;if(r.del)m.del=r.del;else delete m.del}}else if(r.name)m.name=r.name;
    (r.packs||[]).forEach(p=>{let k=pkFind(m,p.id);if(!k){k=JSON.parse(JSON.stringify(p));k.u=k.u||{};m.packs.push(k)}
      else{const u=Object.assign({},p.u||{},k.u||{});const x=k.x||p.x;if(k.stub&&!p.stub){Object.assign(k,JSON.parse(JSON.stringify(p)));delete k.stub}k.u=u;if(x)k.x=1}
      Object.keys(k.u).forEach(key=>{if(dead.has(key))delete k.u[key]})})});

/* Rencana potong kuota untuk isi keranjang: menu yang sama dulu, lalu "Menu bebas"; paket yang paling cepat habis masa berlakunya dipakai lebih dulu */
function subPlan(m,L){
  const P=memLive(m),left=new Map();P.forEach(k=>(k.items||[]).forEach((_,i)=>left.set(k.id+"|"+i,pkLeft(k,i))));

async function chatSend(q){q=String(q||"").trim();if(!q||chatBusy||!chatOn())return;
  if(q==="__tip"){chatH.push({role:"user",content:"Cerita kopi hari ini"},{role:"assistant",content:chatTip()});chatRender();return}
  chatH.push({role:"user",content:q});const a={role:"assistant",content:""};chatH.push(a);chatBusy=true;chatRender();
  if(!SMP||smpOff){await new Promise(r=>setTimeout(r,450));a.content=chatLocal(q);chatBusy=false;chatRender();return}
  chatCtl=new AbortController();
  const turns=chatH.slice(0,-1).filter(m=>m.content&&!m.err).slice(-10);while(turns.length&&turns[0].role!=="user")turns.shift();
  try{const r=await SMP([{role:"user",content:chatRules()},...turns],{cache:false,modelTier:"quick",signal:chatCtl.signal,onText:({text})=>{a.content=text;chatRender()}});a.content=r.text||a.content}
  catch(e){const c=e&&e.code;
    if(c==="cancelled"){a.content=(e.text||a.content||"")+(e.text||a.content?"\n\n_(dihentikan)_":"Dihentikan.")}
    else if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed","session_expired"].includes(c)){smpOff=true;a.content=chatLocal(q)}
    else if(c==="refused"){a.content=chatLocal(q)}
    else{a.content=e&&e.text?e.text:chatLocal(q)}}
  chatBusy=false;chatCtl=null;chatRender()}

    r.onload=()=>{const im=new Image();im.onload=()=>{try{const s=Math.min(1,700/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);const x=cv.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,cv.width,cv.height);x.drawImage(im,0,0,cv.width,cv.height);C().qris=cv.toDataURL("image/jpeg",.9);lg("Ubah QRIS",f.name);save();render();toast("QRIS baru terpasang",1)}catch(e){toast("Gambar ini tidak bisa dipakai. Coba foto lain.")}};im.onerror=()=>toast("File ini bukan gambar. Pilih foto atau screenshot QRIS.");im.src=r.result};
    r.readAsDataURL(f);
  }
  else if(t.id==="rf"&&t.files&&t.files[0]&&own()){
    const f=t.files[0],r=new FileReader();
    r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.prod)||!Array.isArray(o.ing))throw 0;
      const keepUsers=!Array.isArray(o.users);D=fix(o);if(keepUsers)D.users=[Object.assign({},me)].concat(seed().users.filter(u=>u.role!=="owner"));
      lg("Pulihkan backup",f.name);save();cart={};ch=C().ch.includes(C().lastCh)?C().lastCh:C().ch[0];pm=C().pm[0];look();
      me=D.users.find(u=>u.id===me.id)||D.users.find(u=>u.role==="owner");render();toast("Backup dipulihkan",1)}catch(err){toast("File ini bukan backup 521 Coffee. Pilih file .json dari menu Backup.")}};
    r.readAsText(f);
  }
});
document.addEventListener("keydown",e=>{
  if(!me&&!$("#login").hidden){
    if(e.target.id==="lpw"){if(e.key==="Enter"){e.preventDefault();tryLogin(true)}return}
    if(/^\d$/.test(e.key)&&buf.length<32){buf+=e.key;$("#lerr").textContent="";tryLogin()}
    else if(e.key==="Backspace"){buf=buf.slice(0,-1);dots()}
    else if(e.key==="Enter")tryLogin(true);
    return;
  }
  if(e.key==="Enter"&&e.target.id==="vin"){e.preventDefault();const g=document.querySelector("[data-a=vcgo]");if(g)g.click();return}
  if(e.key==="Escape"&&!$("#m").hidden)shut();
});

/* ---------- Welcome: logo tergambar → terisi → kilau → "Selamat datang" → zoom menembus ke halaman ---------- */
const hiCfg=()=>{const c=(K.store&&K.store.intro)||{};return{on:c.on!==0,sec:Math.min(10,Math.max(3,+c.sec||6)),fs:Math.min(130,Math.max(80,+c.fs||100))}};
let hiN=0;
/* Layar pembuka. host = body (asli) atau bingkai preview di Atur. Durasi diskalakan lewat playbackRate (desain dasar 6 detik). */
function hiPlay(host,prev,cfg){
  cfg=cfg||hiCfg();const k=cfg.sec/6,rate=1/k,n=++hiN;
  const paths=[...document.querySelectorAll("#logo path")].map((p,i)=>`<path pathLength="1" style="--i:${i}" d="${p.getAttribute("d")}"/>`).join("");
  const nm=esc(K.store.name||C().name||"521 Coffee"),tg=esc(K.store.tagline||C().sub||"");
  const word=(t,d0)=>[...t].map((ch,i)=>`<span style="--d:${(d0+i*.055).toFixed(3)}s">${ch===" "?"&nbsp;":esc(ch)}</span>`).join("");
  const w=document.createElement("div");w.className="hi"+(prev?" prev":"");w.style.setProperty("--fs",cfg.fs/100);
  if(!prev){w.setAttribute("role","dialog");w.setAttribute("aria-label","Selamat datang di "+(K.store.name||"521 Coffee"))}else w.setAttribute("aria-hidden","true");
  w.innerHTML=`<div class="hi-glow"></div><div class="hi-pos"><div class="hi-c"><div class="hi-logo"><svg viewBox="210 60 1565 1015" aria-hidden="true"><defs><clipPath id="hiclip${n}">${paths}</clipPath><linearGradient id="hisg${n}" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><g class="hi-stroke">${paths}</g><g class="hi-fill">${paths}</g><g clip-path="url(#hiclip${n})"><rect class="hi-sh" x="-200" y="0" width="420" height="1200" fill="url(#hisg${n})"/></g></svg></div>
    <h1 class="hi-t">${word("Selamat datang",1.95)}</h1><p class="hi-s">di <b>${nm}</b></p>${tg?`<p class="hi-g">${tg}</p>`:""}</div></div>
    <button class="hi-skip" data-hi="skip" tabindex="${prev?-1:0}">Lewati</button>`;
  host.appendChild(w);if(!prev)document.documentElement.classList.add("hi-on");
  const speed=el=>{try{getComputedStyle(el).opacity;el.getAnimations({subtree:true}).forEach(a=>a.playbackRate=rate)}catch(e){}};speed(w);
  const PHI=1.618,fit=()=>{const t=w.querySelector(".hi-t"),L=w.querySelector(".hi-logo");if(!t||!L)return;const tw=t.offsetWidth;if(!tw)return;
    const lw=tw/PHI,lh=lw*1015/1565;L.style.width=lw+"px";t.style.marginTop=(lh/(PHI*PHI*PHI))+"px"};
  fit();try{document.fonts&&document.fonts.ready.then(fit)}catch(e){}
  let done=false;const P=$("#pub"),timers=[];
  const end=()=>{if(done)return;done=true;timers.forEach(clearTimeout);w.classList.add("out");speed(w);
    if(prev){setTimeout(()=>{w.remove();const f=host.closest(".hiframe");if(f)f.classList.add("ended")},1350*k);return}
    P.classList.add("hi-in");speed(P);
    setTimeout(()=>{PX0=Date.now();P.classList.remove("intro");void P.offsetWidth;pubRender();P.classList.add("intro");clearTimeout(P._t);P._t=setTimeout(()=>P.classList.remove("intro"),1400)},480*k);
    setTimeout(()=>{w.remove();document.documentElement.classList.remove("hi-on");P.classList.remove("hi-in")},1350*k)};
  w.addEventListener("click",e=>{e.stopPropagation();end()});
  if(!prev)addEventListener("keydown",function kd(e){if(e.key==="Escape"||e.key==="Enter"||e.key===" "){removeEventListener("keydown",kd);end()}});
  timers.push(setTimeout(end,4750*k));
  w._stop=()=>{done=true;timers.forEach(clearTimeout);w.remove()};
  return w;
}
function welcome(){
  let seen=false;try{seen=sessionStorage.getItem("k521-hi")==="1"}catch(e){}
  if(seen||!hiCfg().on||matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  hiPlay(document.body,false);
}
function hiPreview(){const box=$("#hibox");if(!box)return;box.querySelectorAll(".hi").forEach(x=>x._stop&&x._stop());const f=box.closest(".hiframe");if(f)f.classList.remove("ended");hiPlay(box,true)}
look();
try{const sid=sessionStorage.getItem("pos521u");const u=sid&&D.users.find(x=>x.id===sid);if(u)me=u}catch(e){}
if(me)enter();else if(location.hash==="#masuk")showLogin();else{showPub();welcome()}
teamPull();
setInterval(()=>{if(!$("#pub").hidden&&$("#m").hidden)pubRender()},60000);
</script>
