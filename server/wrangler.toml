# Server mini 521 Coffee App (Cloudflare Workers, paket gratis cukup)
name = "coffee521-api"
main = "src/index.js"
compatibility_date = "2025-10-01"
workers_dev = true

# Halaman web publik (menu, promo, kabar) untuk link di media sosial.
# Isinya dibuat oleh: python3 scripts/build_web.py (otomatis saat build_android.py)
[assets]
directory = "./web"
binding = "ASSETS"

[vars]
APP_ORIGIN = "https://appassets.androidplatform.net"
CLAUDE_MODEL = "claude-haiku-5-5"   # model cepat & hemat untuk Chat 521
CHAT_MAX_TOKENS = "800"
CHAT_DAILY_MAX = "400"              # batas total pertanyaan Chat 521 per hari (pengaman tagihan)

# Rahasia (JANGAN ditulis di file ini). Isi dengan:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put OWNER_KEY
#   npx wrangler secret put FCM_SA < kunci-firebase.json   (opsional: notifikasi instan, lihat docs/PANDUAN-NOTIFIKASI-INSTAN.md)

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub", "Room"]

# Pembatas laju bawaan Cloudflare (period hanya boleh 10 atau 60 detik)
[[ratelimits]]
name = "CHAT_LIMIT"
namespace_id = "5211"
simple = { limit = 6, period = 60 }

[[ratelimits]]
name = "AUTH_LIMIT"
namespace_id = "5212"
simple = { limit = 8, period = 60 }

[[ratelimits]]
name = "LOGIN_LIMIT"           # masuk dengan nama & PIN (per alamat IP)
namespace_id = "5213"
simple = { limit = 12, period = 60 }

[[ratelimits]]
name = "SYNC_LIMIT"            # sinkron stok & transaksi antar-HP
namespace_id = "5214"
simple = { limit = 240, period = 60 }
